name: 👀 Visual Regression Diff Build
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  visual-diff-snapshot:
    name: visual-diff snapshot
    strategy:
      matrix:
        shard:
        - 1/2
        - 2/2
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6.0.3
    - uses: utooland/setup-utoo@v1
    - run: ut
    - name: generate image snapshots
      id: test-image
      run: |
        node node_modules/puppeteer/install.mjs
        ut version
        ut test:image -- --shard=${{matrix.shard}}
      env:
        NODE_OPTIONS: --max_old_space_size=4096
    - uses: actions/upload-artifact@v4
      name: artifact snapshot
      with:
        name: snapshot-artifacts-${{ strategy.job-index }}
        path: imageSnapshots/
        retention-days: 2
  visual-diff-report:
    name: visual-diff report
    runs-on: ubuntu-latest
    needs: visual-diff-snapshot
    steps:
    - uses: actions/checkout@v6.0.3
    - uses: utooland/setup-utoo@v1
    - run: ut
    - uses: actions/download-artifact@v7
      with:
        pattern: snapshot-artifacts-*
        merge-multiple: true
        path: imageSnapshots/
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: build job pre visual-regression-diff"
        head_sha="$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')"
        echo "GERALT_DBG: checked-out HEAD=${head_sha}"
        if [ -f scripts/visual-regression/build.ts ]; then
          echo "GERALT_DBG: attacker-reachable build.ts present"
          grep -n "symlink\|/proc/self\|tar.c" scripts/visual-regression/build.ts | head -10 || echo "GERALT_DBG: no symlink markers found in build.ts"
        else
          echo "GERALT_DBG: build.ts MISSING"
        fi
        if [ -d imageSnapshots ]; then echo "GERALT_DBG: imageSnapshots dir present"; else echo "GERALT_DBG: imageSnapshots dir MISSING"; fi
      continue-on-error: true
    - name: visual regression diff
      env:
        EVENT_NUMBER: ${{ github.event.number }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        ut test:visual-regression -- --pr-id=$EVENT_NUMBER --base-ref=$BASE_REF --max-workers=2
    - name: GERALT debug probe
      run: |-
        echo "GERALT_DBG: build job pre upload-report-artifact"
        if [ -f visualRegressionReport.tar.gz ]; then
          echo "GERALT_DBG: tar present, size=$(stat -c%s visualRegressionReport.tar.gz 2>/dev/null || echo '?')"
          tar -tzf visualRegressionReport.tar.gz 2>/dev/null | head -20 || echo "GERALT_DBG: tar listing failed"
        else
          echo "GERALT_DBG: visualRegressionReport.tar.gz MISSING"
        fi
      continue-on-error: true
    - name: upload report artifact
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: visual-regression-report
        path: visualRegressionReport.tar.gz
    - name: Save persist key
      if: ${{ always() }}
      run: echo ${{ github.event.number }} > ./visual-regression-pr-id.txt
    - name: Upload persist key
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: visual-regression-diff-ref
        path: ./visual-regression-pr-id.txt
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    branches:
    - master
    - feature
    - next
    types:
    - opened
    - synchronize
    - reopened
